<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books &middot; Royce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #242424;
      color: #f4f4f4;
      font-family: "Instrument Sans", system-ui, sans-serif;
    }

    main {
      padding: 12vh 11vw 8vh;
      max-width: 52rem;
    }

    h1 {
      font-size: clamp(1.8rem, 2.8vw, 2.3rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.1;
    }

    .list {
      list-style: none;
      padding: 0;
      margin-top: 2.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .list li {
      font-size: clamp(1.05rem, 1.8vw, 1.2rem);
      color: #e6e6e6;
      line-height: 1.55;
      letter-spacing: -0.005em;
    }

    .list .no-break {
      white-space: nowrap;
    }

    footer {
      margin-top: 3.5rem;
    }

    .back {
      color: #8a8a8a;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: -0.005em;
      transition: color 0.15s ease;
    }

    .back:hover,
    .back:focus-visible {
      color: #f4f4f4;
    }

    @media (max-width: 520px) {
      main { padding-left: 6vw; padding-right: 6vw; }
      .list .no-break { white-space: normal; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Some of my favourite books</h1>

    <ul class="list">
      <li class="no-break">Three Body Problem, The Dark Forest, Death's End</li>
      <li>The Wandering Earth</li>
      <li>1984</li>
      <li>Animal Farm</li>
      <li>When Breath Becomes Air</li>
      <li>The Art of Thinking Clearly</li>
    </ul>

    <footer>
      <a href="index.html" class="back">&larr; Back to home</a>
    </footer>
  </main>
</body>
</html>
