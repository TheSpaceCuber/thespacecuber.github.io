<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: #242424;
      color: #f4f4f4;
      font-family: "Instrument Sans", system-ui, sans-serif;
    }

    main {
      padding: 12vh 11vw;
    }

    h1 {
      font-size: clamp(2.2rem, 3.5vw, 1.25rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1.05;
      white-space: nowrap;
    }

    p {
      margin-top: 1.35rem;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
      color: #c8c8c8;
    }

    @media (max-width: 520px) {
      h1 {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm Royce.</h1>
    <p>I'm a Quantitative Engineer at a Private Markets Asset Manager.</p>
  </main>
</body>
</html>
